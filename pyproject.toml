[project]
name = "videohuman"
version = "0.1.0"
description = "videohuman — CLI 优先的本地数字人口播视频流水线"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# torch 系从 PyTorch 官方 cu128 索引安装(Blackwell/50 系显卡必须 cu128+;
# 其他显卡可改 tool.uv.index 的 cu 版本或删掉索引配置走 PyPI 默认)。
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "fonttools>=4.50",
    "imageio-ffmpeg>=0.5",
    "openai>=1.0",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers==4.51.3",
    "diffusers>=0.30.2,<1",
    "numpy>=1.26,<2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-contrib-python>=4.9",
    "einops>=0.8",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "pillow>=10",
    "HyperPyYAML>=1.2",
    "modelscope>=1.20",
    "onnxruntime-gpu==1.22.*",
    "openai-whisper==20231117",
    "inflect>=7",
    "conformer==0.3.2",
    "x-transformers>=2",
    "scipy>=1.12",
    "regex>=2024.4",
    "mediapipe==0.10.21",
    "hydra-core>=1.3",
    "pyarrow>=18",
    "pyworld>=0.3.4",
    "funasr>=1.2",
    "biliup>=0.4",
    "playwright>=1.40",
    "insightface==0.7.3",
    "kornia>=0.8.3",
    "accelerate>=1.14.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# openai-whisper 20231117 的 sdist 构建期 import pkg_resources 但未声明;
# setuptools>=81 已移除 pkg_resources,需钉旧版
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[project.scripts]
vh = "vh_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vh_core", "vh_cli", "vh_server"]
